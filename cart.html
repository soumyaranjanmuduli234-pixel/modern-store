<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - E-Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">E-Shop</a>
            <div class="hamburger">☰</div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>Shopping Cart</h2>
        <br>
        <div class="card" id="cart-list"></div>
        <div style="text-align: right; margin-top: 1rem;">
            <h3>Total: ₹<span id="cart-total">0</span></h3>
            <br>
            <a href="checkout.html" class="btn">Proceed to Checkout</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function loadCart() {
            const cartList = document.getElementById('cart-list');
            const cartTotal = document.getElementById('cart-total');
            const cart = JSON.parse(localStorage.getItem('ecom_cart')) || [];

            if (cart.length === 0) {
                cartList.innerHTML = '<p>Your cart is empty.</p>';
                cartTotal.textContent = '0';
                return;
            }

            let total = 0;
            cartList.innerHTML = cart.map(item => {
                total += item.price * item.quantity;
                return `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 0.5rem 0;">
                        <div>
                            <h4>${item.name}</h4>
                            <p>₹${item.price} x ${item.quantity}</p>
                        </div>
                        <p>₹${item.price * item.quantity}</p>
                    </div>
                `;
            }).join('');

            cartTotal.textContent = total;
        }
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
