<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - E-Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">E-Shop</a>
            <div class="hamburger">☰</div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <h2>Admin Panel (Add Product)</h2>
            <br>
            <form id="add-product-form">
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="p-name" required>
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="p-price" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="p-img" value="https://via.placeholder.com/200" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Add Product</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('add-product-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const products = JSON.parse(localStorage.getItem('ecom_products')) || [];

            const newProduct = {
                id: Date.now(),
                name: document.getElementById('p-name').value,
                price: parseFloat(document.getElementById('p-price').value),
                img: document.getElementById('p-img').value
            };

            products.push(newProduct);
            localStorage.setItem('ecom_products', JSON.stringify(products));
            alert('Product added successfully!');
            document.getElementById('add-product-form').reset();
        });
    </script>
</body>
</html>
