<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - E-Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">E-Shop</a>
            <div class="hamburger">☰</div>
            <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="admin.html">Admin</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <h2>User Profile</h2>
            <br>
            <div id="user-details"></div>
            <br>
            <button onclick="logout()" class="btn" style="background-color: #ef4444;">Logout</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function loadProfile() {
            const user = JSON.parse(localStorage.getItem('ecom_current_user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('user-details').innerHTML = `
                <p><strong>Name:</strong> ${user.name}</p>
                <p><strong>Email:</strong> ${user.email}</p>
            `;
        }

        function logout() {
            localStorage.removeItem('ecom_current_user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
